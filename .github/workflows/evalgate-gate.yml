name: Published SDK refund gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refund-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  approval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install the published SDK from the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Check the committed accepted baseline
        run: |
          npx --no-install @evalgate/sdk discover --manifest
          npm run gate
      - name: Independently prove PASS BLOCK PASS
        run: npm run demo
      - name: Preserve actual execution proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: refund-gate-proof
          path: proof/
          retention-days: 7
