name: Published SDK refund gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refund-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  approval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install the published SDK from the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Check the committed accepted baseline
        run: |
          npx --no-install @evalgate/sdk discover --manifest
          npm run gate
      - name: Independently prove PASS BLOCK PASS
        run: npm run demo
      - name: Preserve actual execution proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refund-gate-proof
          path: proof/
          retention-days: 7
